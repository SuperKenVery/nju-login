[project]
name = "nju-login-simple"
dynamic = ["version"]
description = "Login to authserver.nju.edu.cn, using python requests"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ddddocr>=1.5.6",
    "lxml>=6.0.0",
    "onnxruntime==1.19.2",
    "pycryptodomex>=3.23.0",
    "requests>=2.32.4",
]

[build-system]
requires = ["setuptools>=80", "setuptools-scm>=9.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nju_login*"]

[tool.setuptools_scm]

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "opencv-python>=5.0.0.93",
]
