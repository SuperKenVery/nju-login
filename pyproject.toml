[project]
name = "nju-login-simple"
version = "1.2"
description = "Login to authserver.nju.edu.cn, using python requests"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ddddocr>=1.5.6",
    "lxml>=6.0.0",
    "onnxruntime==1.19.2",
    "pycryptodomex>=3.23.0",
    "requests>=2.32.4",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nju_login"
module-root = "src"

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "opencv-python>=5.0.0.93",
]
